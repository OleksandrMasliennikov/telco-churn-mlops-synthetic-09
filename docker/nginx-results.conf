# docker/nginx-results.conf
# Простий сервер статики для перегляду PNG/CSV з results/ у браузері.
# Використовується сервісом lab-results (docker-compose.theme9.yml, порт 8888)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Автоматичний листинг файлів у results/ — зручно, щоб побачити
    # всі графіки одним посиланням: http://localhost:8888/
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
